## 🏷️ Compatibility Status

**Select ONE status label** (update the label on the right sidebar):

- [ ] `status-playable` - **Playable**: Completable with minor/no issues; stable 30/60 FPS
- [ ] `status-ingame` - **Ingame**: Reaches gameplay but has major issues (crashes, graphics, performance)
- [ ] `status-menus` - **Menus**: Boots to main menu only; crashes/freezes before gameplay
- [ ] `status-intro` - **Intro**: Reaches logos/intro screens but crashes before menus
- [ ] `status-boots` - **Boot**: Shows something (logo, splash) but crashes before intro
- [ ] `status-nothing` - **Nothing**: Black screen, immediate crash, or fails to boot

