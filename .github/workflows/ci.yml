name: Clean rebuild CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: windows-x64-debug
            shell: pwsh
          - os: windows-2025
            preset: windows-x64-release
            shell: pwsh
          - os: ubuntu-24.04
            preset: linux-x64-debug
            shell: bash
          - os: ubuntu-24.04
            preset: linux-x64-release
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Initialize MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: CMake version
        run: cmake --version

      - name: Ninja version
        run: ninja --version

      - name: Configure clean root
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Retain build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/ctest.log
            out/build/${{ matrix.preset }}/junit.xml
            out/build/${{ matrix.preset }}/Testing/Temporary/*.log
            out/build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            out/build/${{ matrix.preset }}/CMakeFiles/CMakeOutput.log
            out/build/${{ matrix.preset }}/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 7
